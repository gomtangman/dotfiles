name: Lint

on:
  push:
  pull_request:

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 -n1 shellcheck
